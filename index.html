<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شات السكيلز</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1f; --muted:#6b6b6b; --accent:#2f6fed; --border:#e3e3e0; --user:#e8f0ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161618; --panel:#1f1f22; --text:#ececec; --muted:#9a9a9f; --accent:#6d9bff; --border:#2e2e33; --user:#24324a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 17px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-start; background: var(--user); }
  .bot { align-self: flex-end; background: var(--panel); border: 1px solid var(--border); }
  .used { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .used a { color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--panel); }
  textarea { flex: 1; resize: none; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; min-height: 44px; max-height: 140px; }
  button { padding: 0 18px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  aside { width: 300px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
  aside .head { padding: 12px; border-bottom: 1px solid var(--border); }
  aside input[type=search] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  #skills { overflow-y: auto; flex: 1; }
  .skill { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .skill label { display: flex; gap: 8px; cursor: pointer; }
  .skill .name { font-weight: 600; }
  .skill .desc { color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .skill .repo { color: var(--muted); font-size: 11px; direction: ltr; text-align: left; }
  .toggle { font-size: 13px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
  @media (max-width: 760px) {
    aside { display: none; }
    .msg { max-width: 95%; }
  }
</style>
</head>
<body>
<header>
  <h1>شات السكيلز</h1>
  <span id="status">جارٍ الاتصال…</span>
</header>
<main>
  <aside>
    <div class="head">
      <input type="search" id="q" placeholder="ابحث في السكيلز…">
    </div>
    <label class="toggle"><input type="checkbox" id="auto" checked> اختيار السكيلز تلقائياً</label>
    <div id="skills"></div>
  </aside>
  <section id="chat">
    <div id="messages"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="اكتب سؤالك…"></textarea>
      <button id="send" type="submit">إرسال</button>
    </form>
  </section>
</main>
<script>
const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const skillsEl = document.getElementById("skills");
const qEl = document.getElementById("q");
const autoEl = document.getElementById("auto");
const statusEl = document.getElementById("status");

const history = [];      // {role, content}
const pinned = new Set(); // skill ids chosen by the user

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function addMessage(role, text, used) {
  const box = el("div", "msg " + (role === "user" ? "user" : "bot"), text);
  messagesEl.appendChild(box);
  if (used && used.length) {
    const u = el("div", "used", "السكيلز المستخدمة: ");
    used.forEach((s, i) => {
      const a = el("a", "", s.name);
      a.href = s.source_url; a.target = "_blank"; a.rel = "noopener";
      u.appendChild(a);
      if (i < used.length - 1) u.appendChild(document.createTextNode("، "));
    });
    box.appendChild(u);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return box;
}

async function loadSkills(q = "") {
  const res = await fetch("/api/skills?limit=100&q=" + encodeURIComponent(q));
  const list = await res.json();
  skillsEl.textContent = "";
  for (const s of list) {
    const row = el("div", "skill");
    const label = el("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = pinned.has(s.id);
    cb.addEventListener("change", () => cb.checked ? pinned.add(s.id) : pinned.delete(s.id));
    const info = el("div");
    info.appendChild(el("div", "name", s.name));
    info.appendChild(el("div", "desc", s.description || ""));
    info.appendChild(el("div", "repo", s.repo + (s.license ? " · " + s.license : "")));
    label.append(cb, info);
    row.appendChild(label);
    skillsEl.appendChild(row);
  }
}

async function init() {
  try {
    const st = await (await fetch("/api/status")).json();
    let label = `${st.skills} سكيل`;
    if (!st.modelConfigured) label += " · النموذج غير مربوط";
    else label += st.modelOnline ? " · النموذج متصل ✅" : " · النموذج غير متصل ⚠️";
    statusEl.textContent = label;
  } catch { statusEl.textContent = "تعذّر الاتصال بالخادم"; }
  loadSkills();
}

let searchTimer;
qEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadSkills(qEl.value.trim()), 250);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

const form = document.getElementById("form");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMessage("user", text);
  history.push({ role: "user", content: text });
  const thinking = addMessage("bot", "…");
  sendBtn.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: history,
        pinned: [...pinned],
        autoSkills: autoEl.checked,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "خطأ غير معروف");
    thinking.remove();
    addMessage("bot", data.text, data.skillsUsed);
    history.push({ role: "assistant", content: data.text });
  } catch (err) {
    thinking.textContent = "تعذّر الحصول على رد: " + err.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

init();
</script>
</body>
</html>
